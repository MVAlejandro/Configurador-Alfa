<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurador - Pallets Alfa</title>
    <link rel="stylesheet" href="./css/cliente.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="icon" href="./assets/Logo-Color-PNG-62x51.png">
</head>
<body>
    <!-- BARRA DE RELLENO SUPERIOR -->
    <div id="top_bar">
        <br>
    </div>

    <!-- BARRA DE NAVEGACION PRINCIPAL -->
    <header id="site_header">
        
    </header>
    
    <!-- BARRA DE NAVEGACION SECUNDARIO -->
    <div id="btn_bar">
        <nav id="nav_secundario" class="navbar w-100">
            <div class="col-auto">
                <button id="btn_regresar" class="btn btn-outline-success ms-5" type="button">Regresar</button>
            </div> 
            <div class="col text-center">
                <h2 style="color: #F5F5F5;">Configurador</h2>
            </div>
            <div class="col-auto">
                <button id="btn_siguiente" class="btn btn-outline-success me-5" type="button" data-bs-toggle="modal" data-bs-target="#staticBackdrop">Siguiente</button>
            </div> 
        </nav>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main id="main" class="container mt-5 d-flex justify-content-center">
        <div class="card mb-3 ms-3 me-3 w-75">
            <div class="row g-0">
                <div id="img_form" class="col-md-5">
                    <img src="./assets/Pallets-Alfa-Clientes-810X1439(2).jpg" class="img-fluid rounded-start" alt="Tarimas listas para envío">
                </div>
                <div class="col-md-7">
                <div class="card-body">
                    <div class="container">
                        <div class="d-flex align-items-center justify-content-between flex-wrap">
                            <h1 class="card-title mt-3 mb-5">Cliente</h1>
                            <img src="./assets/Logo-Color-PNG-62x51.png" alt="Logo" id="logo_footer" class="mb-3">
                        </div>
                        <p><strong>Ingrese los datos del cliente a cotizar</strong></p>
                        <!-- Formulario -->
                        <form>
                            <div class="cliente form-floating mb-3">
                                <input type="text" id="razon" class="form-control" placeholder="Razon">
                                <label for="razon">Razón social</label>
                                <p class="error invalid-feedback" id="error-razon" style="color: red;"></p>
                            </div>
                            <div class="cliente form-floating mb-3">
                                <input type="text" id="rfc" class="form-control" placeholder="RFC">
                                <label for="rfc">RFC</label>
                                <p class="error invalid-feedback" id="error-rfc" style="color: red;"></p>
                            </div>
                            <div class="cliente form-floating mb-3">
                                <input type="text" id="nombre" class="form-control" placeholder="Nombre">
                                <label for="nombre">Nombre</label>
                                <p class="error invalid-feedback" id="error-nombre" style="color: red;"></p>
                            </div>
                            <div class="cliente form-floating mb-3">
                                <input type="number" id="cp" class="form-control no-arrows" placeholder="CP">
                                <label for="cp">Código Postal</label>
                                <p class="error invalid-feedback" id="error-cp" style="color: red;"></p>
                            </div>
                            <div class="cliente form-floating mb-3">
                                <input type="text" id="direccion" class="form-control" placeholder="Direccion">
                                <label for="direccion">Dirección</label>
                                <p class="error invalid-feedback" id="error-direccion" style="color: red;"></p>
                            </div>
                            <div class="cliente form-floating mb-3">
                                <input type="number" id="numero" class="form-control no-arrows" placeholder="Numero">
                                <label for="numero">Número</label>
                                <p class="error invalid-feedback" id="error-numero" style="color: red;"></p>
                            </div>
                            <div class="cliente form-floating mb-3">
                                <input type="text" id="destino" class="form-control" placeholder="Destino">
                                <label for="destino">Destino de entrega</label>
                                <p class="error invalid-feedback" id="error-destino" style="color: red;"></p>
                            </div>
                        </form>
                    </div>
                </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer id="site_footer">
        
    </footer>
    
<script src="./js/nav.js"></script>
<script src="./js/cliente.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>
</html>
