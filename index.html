<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurador - Pallets Alfa</title>
    <link rel="stylesheet" href="./css/index.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="icon" href="./assets/Logo-Color-PNG-500x400-1.png">
</head>
<body>

    <!-- BARRA DE RELLENO SUPERIOR -->
    <div id="top_bar">
        <br>
    </div>

    <!-- BARRA DE NAVEGACION PRINCIPAL -->
    <header id="site_header">
        
    </header>
    
    <!-- BARRA DE NAVEGACION SECUNDARIO -->
    <div id="btn_bar">
        <nav id="nav_secundario" class="navbar w-100">
            <div class="col text-center">
                <h2>Configurador de tarimas</h2>
                </div>
            <div class="col-auto">
                <button id="btn_agregar" class="btn btn-outline-success me-5" type="button">Agregar</button>
            </div> 
        </nav>
    </div>
    
    <!-- CONTENIDO PRINCIPAL -->
    <main id="main" class="container mt-5">        
        <div class="row d-flex">
            <div class="col-sm-4 select-bar d-flex flex-column justify-content-center">
                <div class="opciones_tarima">
                    <!-- Tipo de la tarima -->
                    <div id="op_tipo" class="d-flex align-items-center mb-3">
                        <p class="titulo_opcion mb-0 me-3">TIPO:</p>
                        <select id="tipo" class="form-select" aria-label="Default select example">
                            <option value="Nueva">Nueva</option>
                            <option value="Reciclada">Reciclada</option>
                        </select>
                    </div>
                    <!-- Subtipo de la tarima -->
                    <div id="op_subtipo" class="d-flex align-items-center mb-3">
                        <p class="titulo_opcion mb-0 me-3">SUBTIPO: </p>
                        <select id="subtipo" class="form-select" aria-label="Default select example">
                            <option value="1">Seleccione...</option>
                            <option value="Barrote">Barrote</option>
                            <option value="Tacón">Tacón</option>
                        </select>
                    </div>
                    <!-- Acomodo de la tarima -->
                    <div id="op_acomodo" class="d-flex align-items-center mb-3">
                        
                    </div>
                    <!-- Tamaño de la tarima -->
                    <div class="d-flex flex-column mb-4">
                        <div class="d-flex align-items-center">
                            <p class="titulo_opcion mb-0 me-3">TAMAÑO: </p>
                            <div id="op_tamaño" class="d-flex flex-column">
                                <div class="d-flex align-items-center">
                                    <div class="me-2 text-center">
                                        <input type="number" id="largoGral" class="form-control no-arrows gral" min="1" placeholder="Largo">
                                    </div>
                                    <span class="mx-2">x</span>
                                    <div class="me-2 text-center">
                                        <input type="number" id="anchoGral" class="form-control no-arrows gral" min="1" placeholder="Ancho">
                                    </div>
                                    <span class="mx-2">x</span>
                                    <div class="text-center">
                                        <input type="number" id="grosorGral" class="form-control no-arrows gral" min="1" placeholder="Grosor">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
    
                <!-- Características -->
                <div id="caracteristicas_tarima">

                </div>
            </div>

            <!-- Plano -->
            <div class="col-sm-8 plano d-flex justify-content-center align-items-start mt-3 mb-5">
                <div id="plano_tarima">
                    <img src="./assets/Logo-Color-PNG-500x400-2.png" alt="Logo" height="230px" id="logo_main" class="mt-4">
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer id="site_footer">
        
    </footer>
    
<script src="./js/nav.js"></script>
<script src="./js/index_formulario.js" type="module"></script>
<script src="./js/index.js" type="module"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>
</html>
