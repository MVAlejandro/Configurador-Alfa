<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurador - Pallets Alfa</title>
    <link rel="stylesheet" href="./css/main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="icon" href="./assets/Logo-Color-PNG-500x400-1.png">
</head>
<body>

    <!-- Barra superiror de relleno -->
    <div id="top-bar">
        <br>
    </div>

    <!-- Barra de navegación principal -->
    <header id="site-header">
        
    </header>
    
    <!-- Barra de navegación secundaria -->
    <div id="bar-btn">
        <nav id="nav-sec" class="navbar w-100">
            <div class="col text-center">
                <h2>Configurador de tarimas</h2>
                </div>
            <div class="col-auto">
                <button id="btn-sig" class="btn btn-outline-success me-5" type="button">Siguiente</button>
            </div> 
        </nav>
    </div>

    <!-- Contenido principal -->
    <main id="main" class="container mt-5">        
        <div class="row d-flex">
            <div class="col-sm-4 select-bar d-flex flex-column justify-content-center">
                <div class="op">
                    <!-- Tipo de la tarima -->
                    <div class="op-est d-flex align-items-center mb-3">
                        <p class="op-des mb-0 me-3">TIPO:</p>
                        <select id="tipo" class="form-select" aria-label="Default select example">
                            <option value="1">Nueva</option>
                            <option value="2">Reciclada</option>
                        </select>
                    </div>
                    <!-- Subtipo de la tarima -->
                    <div class="op-tip d-flex align-items-center mb-3">
                        <p class="op-des mb-0 me-3">SUBTIPO: </p>
                        <select id="subtipo" class="form-select" aria-label="Default select example">
                            <option value="1">---</option>
                            <option value="2">Barrote</option>
                            <option value="3">Tacón</option>
                        </select>
                    </div>
                    <!-- Tamaño de la tarima -->
                     <div class="op-tip d-flex align-items-center mb-4">
                        <p class="op-des mb-0 me-3">TAMAÑO: </p>
                        <div class="d-flex">
                            <input type="number" id="largoGral" class="form-control no-arrows" min="1" placeholder="Largo">
                            <span class="my-1 mx-2">x</span>
                            <input type="number" id="anchoGral" class="form-control no-arrows" min="1" placeholder="Ancho">
                            <span class="my-1 mx-2">x</span>
                            <input type="number" id="grosorGral" class="form-control no-arrows" min="1" placeholder="Grosor">
                        </div>
                     </div>
                </div>
    
                <!-- Características -->
                <div id="caracteristicas">

                </div>
            </div>

            <!-- Plano -->
            <div class="col-sm-8 plano d-flex justify-content-center align-items-center">
                <div id="plano">
                    <img src="./assets/Logo-Minimal.jpeg" alt="Logo" height="300px">
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer id="site-footer">
        
    </footer>
    
<script src="./js/main.js"></script>
<script src="./js/form.js"></script>
<script src="./js/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>
</html>
