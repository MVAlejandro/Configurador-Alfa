<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurador - Pallets Alfa</title>
    <link rel="stylesheet" href="./css/main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="icon" href="./assets/Logo-Color-PNG-500x400-1.png">
</head>
<body>

    <!-- Barra superiror de relleno -->
    <div id="top-bar">
        <br>
    </div>

    <!-- Barra de navegación principal -->
    <header id="site-header">
        
    </header>
    
    <!-- Barra de navegación secundaria -->
    <div id="bar-btn">
        <nav id="nav-sec" class="navbar w-100">
            <div class="col text-center">
                <h2>Configurador de tarimas</h2>
                </div>
            <div class="col-auto">
                <a href="./resume.html">
                <button id="btn-sig" class="btn btn-outline-success me-5" type="button">Siguiente</button>
                </a>
            </div> 
        </nav>
    </div>

    <!-- Contenido principal -->
    <main id="main" class="container mt-5">        
        <div class="row d-flex">
            <div class="col-sm-4 select-bar d-flex flex-column justify-content-center">
                <div class="op">
                    <!-- Estado de la tarima -->
                    <div class="op-est d-flex align-items-center mb-3">
                        <p class="op-des mb-0 me-3">ESTADO:</p>
                        <select id="estado" class="form-select" aria-label="Default select example">
                            <option value="1">Nueva</option>
                            <option value="2">Reciclada</option>
                        </select>
                    </div>
                    <!-- Tipo de la tarima -->
                    <div class="op-tip d-flex align-items-center mb-4">
                        <p class="op-des mb-0 me-3">TIPO: </p>
                        <select id="tipo" class="form-select" aria-label="Default select example">
                            <option value="1">Ciega</option>
                            <option value="2">Barrote</option>
                            <option value="3">Tacón</option>
                            <option value="4">Tacón chico</option>
                        </select>
                    </div>
                </div>
    
                <!-- Características -->
                <div class="caracteristicas">

                    <div class="accordion" id="accordionCaracter">
                        <!-- TABLA SUPERIOR -->
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#panelsStayOpen-collapseOne" aria-expanded="true" aria-controls="panelsStayOpen-collapseOne">
                                <p class="car-des mb-0 me-3">Tabla superior</p>
                            </button>
                            </h2>
                            <div id="panelsStayOpen-collapseOne" class="accordion-collapse collapse">
                                <div class="accordion-body ms-4">
                                    <!-- Cantidad -->
                                    <div class="cantidad d-flex align-items-center">
                                        <label for="cantidadTS" class="col-form-label me-3">Cantidad: </label>
                                        <input type="number" id="cantidadTS" class="form-control">
                                    </div>
                                    <!-- Largo -->
                                    <div class="largo d-flex align-items-center">
                                        <label for="largoTS" class="col-form-label me-3">Largo: </label>
                                        <input type="number" id="largoTS" class="form-control">
                                    </div>
                                    <!-- Ancho -->
                                    <div class="ancho d-flex align-items-center">
                                        <label for="anchoTS" class="col-form-label me-3">Ancho: </label>
                                        <input type="number" id="anchoTS" class="form-control">
                                    </div>
                                    <!-- Grosor -->
                                    <div class="grosor d-flex align-items-center">
                                        <label for="grosorTS" class="col-form-label me-3">Grosor: </label>
                                        <input type="number" id="grosorTS" class="form-control">
                                    </div>                            
                                </div>
                            </div>
                        </div>
                        <!-- TABLA INFERIOR -->
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#panelsStayOpen-collapseTwo" aria-expanded="false" aria-controls="panelsStayOpen-collapseTwo">
                                <p class="car-des mb-0 me-3">Tabla inferior</p>
                            </button>
                            </h2>
                            <div id="panelsStayOpen-collapseTwo" class="accordion-collapse collapse">
                                <div class="accordion-body ms-4">
                                    <!-- Cantidad -->
                                    <div class="cantidad d-flex align-items-center">
                                        <label for="cantidadTI" class="col-form-label me-3">Cantidad: </label>
                                        <input type="number" id="cantidadTI" class="form-control">
                                    </div>
                                    <!-- Largo -->
                                    <div class="largo d-flex align-items-center">
                                        <label for="largoTI" class="col-form-label me-3">Largo: </label>
                                        <input type="number" id="largoTI" class="form-control">
                                    </div>
                                    <!-- Ancho -->
                                    <div class="ancho d-flex align-items-center">
                                        <label for="anchoTI" class="col-form-label me-3">Ancho: </label>
                                        <input type="number" id="anchoTI" class="form-control">
                                    </div>
                                    <!-- Grosor -->
                                    <div class="grosor d-flex align-items-center">
                                        <label for="grosorTI" class="col-form-label me-3">Grosor: </label>
                                        <input type="number" id="grosorTI" class="form-control">
                                    </div>
                                </div>                            
                            </div>
                        </div>
                        <!-- TACON GRUESO -->
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#panelsStayOpen-collapseThree" aria-expanded="false" aria-controls="panelsStayOpen-collapseThree">
                                <p class="car-des mb-0 me-3">Tacón grueso</p>
                            </button>
                            </h2>
                            <div id="panelsStayOpen-collapseThree" class="accordion-collapse collapse">
                                <div class="accordion-body ms-4">
                                    <!-- Cantidad -->
                                    <div class="cantidad d-flex align-items-center">
                                        <label for="cantidadTAG" class="col-form-label me-3">Cantidad: </label>
                                        <input type="number" id="cantidadTAG" class="form-control">
                                    </div>
                                    <!-- Largo -->
                                    <div class="largo d-flex align-items-center">
                                        <label for="largoTAG" class="col-form-label me-3">Largo: </label>
                                        <input type="number" id="largoTAG" class="form-control">
                                    </div>
                                    <!-- Ancho -->
                                    <div class="ancho d-flex align-items-center">
                                        <label for="anchoTAG" class="col-form-label me-3">Ancho: </label>
                                        <input type="number" id="anchoTAG" class="form-control">
                                    </div>
                                    <!-- Grosor -->
                                    <div class="grosor d-flex align-items-center">
                                        <label for="grosorTAG" class="col-form-label me-3">Grosor: </label>
                                        <input type="number" id="grosorTAG" class="form-control">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- TACON CHICO -->
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#panelsStayOpen-collapseFour" aria-expanded="false" aria-controls="panelsStayOpen-collapseFour">
                                <p class="car-des mb-0 me-3">Tacón delgado</p>
                            </button>
                            </h2>
                            <div id="panelsStayOpen-collapseFour" class="accordion-collapse collapse">
                                <div class="accordion-body ms-4">
                                    <!-- Cantidad -->
                                    <div class="cantidad d-flex align-items-center">
                                        <label for="cantidadTAC" class="col-form-label me-3">Cantidad: </label>
                                        <input type="number" id="cantidadTAC" class="form-control">
                                    </div>
                                    <!-- Largo -->
                                    <div class="largo d-flex align-items-center">
                                        <label for="largoTAC" class="col-form-label me-3">Largo: </label>
                                        <input type="number" id="largoTAC" class="form-control">
                                    </div>
                                    <!-- Ancho -->
                                    <div class="ancho d-flex align-items-center">
                                        <label for="anchoTAC" class="col-form-label me-3">Ancho: </label>
                                        <input type="number" id="anchoTAC" class="form-control">
                                    </div>
                                    <!-- Grosor -->
                                    <div class="grosor d-flex align-items-center">
                                        <label for="grosorTAC" class="col-form-label me-3">Grosor: </label>
                                        <input type="number" id="grosorTAC" class="form-control">
                                    </div>                            </div>
                                </div>
                        </div>
                        <!-- TABLAS DE CARGA -->
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#panelsStayOpen-collapseFive" aria-expanded="false" aria-controls="panelsStayOpen-collapseFive">
                                <p class="car-des mb-0 me-3">Tablas de carga</p>
                            </button>
                            </h2>
                            <div id="panelsStayOpen-collapseFive" class="accordion-collapse collapse">
                                <div class="accordion-body ms-4">
                                    <!-- Cantidad -->
                                    <div class="cantidad d-flex align-items-center">
                                        <label for="cantidadTC" class="col-form-label me-3">Cantidad: </label>
                                        <input type="number" id="cantidadTC" class="form-control">
                                    </div>
                                    <!-- Largo -->
                                    <div class="largo d-flex align-items-center">
                                        <label for="largoTC" class="col-form-label me-3">Largo: </label>
                                        <input type="number" id="largoTC" class="form-control">
                                    </div>
                                    <!-- Ancho -->
                                    <div class="ancho d-flex align-items-center">
                                        <label for="anchoTC" class="col-form-label me-3">Ancho: </label>
                                        <input type="number" id="anchoTC" class="form-control">
                                    </div>
                                    <!-- Grosor -->
                                    <div class="grosor d-flex align-items-center">
                                        <label for="grosorTC" class="col-form-label me-3">Grosor: </label>
                                        <input type="number" id="grosorTC" class="form-control">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                <br>
                </div>
            </div>

            <!-- Plano -->
            <div class="col-sm-8 plano d-flex justify-content-center align-items-center">
                <img src="./assets/TC02N2.png" alt="Plano de la tarima" height="300px">
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer id="site-footer">
        
    </footer>
    
<script src="./js/main.js"></script>
<script src="./js/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>
</html>
