<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurador - Pallets Alfa</title>
    <link rel="stylesheet" href="./css/resume.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="icon" href="./assets/Logo-Color-PNG-500x400-1.png">
    </head>
<body>

    <!-- Barra superiror de relleno -->
    <div id="top-bar">
        <br>
    </div>

    <!-- Barra de navegación principal -->
    <header id="site-header">
        
    </header>
    
    <!-- Barra de navegación secundaria -->
    <div id="bar-btn">
        <nav id="nav-sec" class="navbar w-100">
            <div class="col-auto">
                <a href="./index.html">
                <button id="btn-reg" class="btn btn-outline-success ms-5" type="button">Regresar</button>
                </a>
            </div> 
            <div class="col text-center">
                <h2>Configurador de tarimas</h2>
            </div>
            <div class="col-auto">
                <a href="./resume.html">
                <button id="btn-sig" class="btn btn-outline-success me-5" type="button">Siguiente</button>
                </a>
            </div> 
        </nav>
    </div>

    <!-- Contenido principal -->
    <main id="main" class="container">
        <div class="row d-flex">
            <div class="col-sm-4 select-bar d-flex flex-column justify-content-center">
                <h2 class="mt-5 mb-3">Propiedades</h2>
                <div class="prop">
                    <!-- Card Capacidad de carga -->
                    <div class="cap card mb-5">
                        <div class="card-body">
                            <h5 class="card-title">Capacidad de carga</h5>
                            <p class="card-text">
                                <table class="table table-borderless">
                                    <thead>
                                        
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td>Estática:</td>
                                            <td id="cap-est"></td>
                                        </tr>
                                        <tr>
                                            <td>Dinámica:</td>
                                            <td id="cap-din"></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </p>
                        </div>
                    </div>
                    <!-- Card Descripción -->
                    <div class="desc card mb-5">
                    <div class="card-body">
                        <h5 class="card-title">Descripción</h5>
                        <p class="card-text">
                            <ul id="resumenLista">
                                
                            </ul>
                        </p>
                    </div>
                    </div>
                </div>
            </div>
            <!-- Modelo -->
            <div class="col-sm-8 modelo d-flex flex-column justify-content-center align-items-end">
                <div class="cap card mt-5 me-5">
                    <div class="card-body">
                        <h5 class="card-title">Costo: <span id="precio-fin"></span></h5>
                        <p class="card-text">
                            <ul>
                                <li>Desgloce 1: <span id="desgloce1"></span></li>
                                <li>Desgloce 2: <span id="desgloce2"></span></li>
                                <li>Desgloce 3: <span id="desgloce3"></span></li>
                            </ul>   
                        </p>
                    </div>
                </div>
                    <img src="./assets/Tarima-con-tacon-nueva.png" alt="Tarima con tacón nueva" width="520px" class="d-block mx-auto">
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer id="site-footer">
        
    </footer>
    
<script src="./js/main.js"></script>
<script src="./js/resume.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>
</html>
