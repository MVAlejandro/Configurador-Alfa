<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuesto - Pallets Alfa</title>
    <link rel="stylesheet" href="./css/resumen.css">
    <link rel="stylesheet" href="./css/modal.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="icon" href="./assets/Logo-Color-PNG-62x51.png">
    <script src="js/verificacion.js"></script>
</head>
<body>
    
    <!-- BARRA DE RELLENO SUPERIOR -->
    <div id="top_bar">
        <br>
    </div>

    <!-- BARRA DE NAVEGACION PRINCIPAL -->
    <header id="site_header">
        
    </header>
    
    <!-- BARRA DE NAVEGACION SECUNDARIO -->
    <div id="btn_bar">
        <nav id="nav_secundario" class="navbar w-100">
            <div class="col-auto">
                <button id="btn_regresar" class="btn btn-outline-success ms-5" type="button">Regresar</button>
            </div> 
            <div class="col text-center">
                <h2>Presupuesto</h2>
            </div>
            <div class="col-auto">
                <button id="btn_siguiente" class="btn btn-outline-success me-5" type="button">Siguiente</button>
            </div> 
        </nav>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main id="main" class="container">
        <div class="row d-flex">
            <!-- Card con productos agregados -->
            <div class="col-sm-8 d-flex flex-column justify-content-between position-relative mt-4">
                <div id="lista_productos">
                    
                </div>
            </div>
            <!-- Resumen de pedido -->
            <div class="col-sm-4 ms-auto d-flex flex-column justify-content-between position-relative mt-4">
                <div>
                    <p><u><strong>Cliente: </strong><span id="cliente_activo"></span></u></p> 
                    <ul class="list-group mb-3">
                        <li class="list-group-item d-flex justify-content-between">
                            <h6 id="productos_total_texto">Lote estimado total</h6>
                            <span id="productos_total">0</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between">
                            <h6 id="precio_total_texto">Monto estimado por lote (sin IVA)</h6>
                            <span id="precio_total">$0</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL -->
    <div class="modal fade" id="modal_producto" tabindex="-1" aria-labelledby="modal_productoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="titulo_modal"></h1>
                    <button type="button" id="close-modal" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- CONTENIDO -->
                    <div id="main_div" class="container">
                        <div class="row d-flex">
                            <div class="d-flex align-items-center justify-content-between flex-wrap">
                                <h2 class="mb-3 me-3">Propiedades</h2>
                                <img src="./assets/Logo-Color-PNG-62x51.png" alt="Logo" width="80" id="logo_footer" class="mb-3">
                            </div>
                            <!-- Propiedades -->
                            <div class="col-lg-4 d-flex flex-column justify-content-center">
                                <div id="propiedades">
                                    <!-- Card Descripción -->
                                    <div id="descripcion" class="card card_modal mb-1">
                                    <div class="card-body">
                                        <h5 class="card-title titulo_campo">Descripción</h5>
                                        <p class="card-text">
                                            <ul id="lista_resumen">
                                                
                                            </ul>
                                        </p>
                                    </div>
                                    </div>
                                    <!-- Card Servicios -->
                                    <div id="descripcion" class="card card_modal mb-1">
                                    <div class="card-body">
                                        <h5 class="card-title titulo_campo">Servicios</h5>
                                        <p class="card-text">
                                            <ul id="lista_servicios">
                                                
                                            </ul>
                                        </p>
                                    </div>
                                    </div>
                                    <!-- Card Capacidad de carga -->
                                    <div id="capacidad_carga" class="card card_modal mb-2">
                                        <div class="card-body">
                                            <h5 class="card-title titulo_campo">Capacidad de carga</h5>
                                            <p class="card-text">
                                                <table class="table table-borderless">
                                                    <tbody>
                                                        <tr>
                                                            <td>Estática:</td>
                                                            <td id="capacidad_estatica"></td>
                                                        </tr>
                                                        <tr>
                                                            <td>Dinámica:</td>
                                                            <td id="capacidad_dinamica"></td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Modelo -->
                            <div class="col-lg-8 d-flex flex-column justify-content-between position-relative">
                                <!-- Card Precio -->
                                <div id="costo" class="card card_modal mt-3 me-5 align-self-end">
                                    <div class="card-body card_resumen">
                                        <p>Precio unitario estimado (sin IVA): <span id="costo_unitario"></span></p>
                                        <p>Lote estimado de compra: <span id="cantidad_total"></span></p>
                                        <hr>
                                        <p>Monto estimado por lote (sin IVA): <span id="costo_total"></span></p> 
                                    </div>
                                </div>
                                <!-- Imagen Modelo -->
                                <div id="modelo" class="flex-grow-1 d-flex justify-content-center align-items-start mt-4">
                                </div>
                                <!-- Logo Modal -->
                                <div id="logo_modal" class="position-absolute bottom-0 end-0 mb-5 me-5">
                                    <img src="./assets/Logo-Color-PNG-62x51.png" alt="Logo" width="80px" id="logo_footer" class="me-4">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer id="site_footer">
        
    </footer>
    
<script src="./js/nav.js"></script>
<script src="./js/modal.js"></script>
<script src="./js/resumen.js" type="module"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>
</html>
