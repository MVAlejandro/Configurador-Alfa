<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuesto - Pallets Alfa</title>
    <link rel="stylesheet" href="./css/resumen.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="icon" href="./assets/Logo-Color-PNG-500x400-1.png">
</head>
<body>
    
    <!-- BARRA DE RELLENO SUPERIOR -->
    <div id="top_bar">
        <br>
    </div>

    <!-- BARRA DE NAVEGACION PRINCIPAL -->
    <header id="site_header">
        
    </header>
    
    <!-- BARRA DE NAVEGACION SECUNDARIO -->
    <div id="btn_bar">
        <nav id="nav_secundario" class="navbar w-100">
            <div class="col-auto">
                <button id="btn_regresar" class="btn btn-outline-success ms-5" type="button">Regresar</button>
            </div> 
            <div class="col text-center">
                <h2>Presupuesto</h2>
            </div>
            <div class="col-auto">
                <button id="btn_siguiente" class="btn btn-outline-success me-5" type="button">Siguiente</button>
            </div> 
        </nav>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main id="main" class="container">
        <div class="row d-flex">
            <!-- Card con productos agregados -->
            <div class="col-sm-6 d-flex flex-column justify-content-between position-relative mt-4">
                <div id="lista_productos" class="card">
                    
                </div>
            </div>
            <!-- Resumen de pedido -->
            <div class="col-sm-4 ms-auto d-flex flex-column justify-content-between position-relative mt-4">
                <div>
                    <ul class="list-group mb-3">
                        <li class="list-group-item d-flex justify-content-between">
                                <h5 id="productos_total_texto">Total en Productos</h5>
                            <span id="productos_total">0</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between">
                            <h5 id="precio_total_texto">Total</h5>
                            <span id="precio_total">$0</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer id="site_footer">
        
    </footer>
    
<script src="./js/nav.js"></script>
<script src="./js/resumen.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>
</html>
