<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurador - Pallets Alfa</title>
    <link rel="stylesheet" href="./css/configurador.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="icon" href="./assets/Logo-Color-PNG-62x51.png">
    <script src="js/verificacion.js"></script>
</head>
<body>
    <!-- BARRA DE RELLENO SUPERIOR -->
    <div id="top_bar">
        <br>
    </div>

    <!-- BARRA DE NAVEGACION PRINCIPAL -->
    <header id="site_header">
        
    </header>
    
    <!-- BARRA DE NAVEGACION SECUNDARIO -->
    <div id="btn_bar">
        <nav id="nav_secundario" class="navbar w-100">
            <div class="col-auto">
                <button id="btn_regresar" class="btn btn-outline-success ms-5" type="button">Regresar</button>
            </div> 
            <div class="col text-center">
                <h2>Configurador</h2>
            </div>
            <div class="col-auto">
                <button id="btn_siguiente" class="btn btn-outline-success me-5" type="button" data-bs-toggle="modal" data-bs-target="#staticBackdrop" disabled>Siguiente</button>
            </div> 
        </nav>
    </div>
    
    <!-- CONTENIDO PRINCIPAL -->
    <main id="main" class="container mt-3">
        <p class="text-end"><u><strong>Cliente: </strong><span id="cliente_activo"></span></u></p>        
        <div class="row d-flex">
            <div class="col-md-4 select-bar d-flex flex-column justify-content-center">
                <div class="opciones_tarima">
                    <!-- Subtipo de la tarima -->
                    <div id="op_subtipo" class="d-flex align-items-center mb-3">
                        <p class="titulo_opcion mb-0 me-3">SUBTIPO: </p>
                        <select id="subtipo" class="form-select" aria-label="Default select example">
                            <option value="1">Seleccione...</option>
                            <option value="Barrote">Barrote</option>
                            <option value="Tacón">Tacón</option>
                        </select>
                    </div>
                    <!-- Tipo de la tarima -->
                    <div id="op_tipo" class="d-flex align-items-center mb-3">
                        <p class="titulo_opcion mb-0 me-3">TIPO: </p>
                        <select id="tipo" class="form-select" aria-label="Default select example">
                            <option value="1">Seleccione...</option>
                            <option value="Nueva">Nueva</option>
                            <option value="Reciclada">Reciclada</option>
                        </select>
                    </div>
                    <!-- Acomodo de la tarima -->
                    <div id="op_acomodo" class="d-flex align-items-center mb-3">
                        
                    </div>
                    <!-- Tamaño de la tarima -->
                    <div class="d-flex flex-column mb-4 responsive-flex">
                        <div class="align-items-center">
                            <p class="titulo_opcion mb-1 me-3">TAMAÑO: </p>
                            <div id="op_tamaño" class="d-flex flex-column">
                                <div class="d-flex align-items-center responsive-flex">
                                    <div class="me-2 text-center">
                                        <input type="number" id="anchoGral" class="form-control no-arrows gral" min="1" placeholder="Ancho">
                                    </div>
                                    <span class="mx-2">x</span>
                                    <div class="me-2 text-center">
                                        <input type="number" id="largoGral" class="form-control no-arrows gral" min="1" placeholder="Largo">
                                    </div>
                                    <span class="mx-2">x</span>
                                    <div class="text-center">
                                        <input type="number" id="grosorGral" class="form-control no-arrows gral" min="1" placeholder="Grosor">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
    
                <!-- Características -->
                <div id="caracteristicas_tarima">

                </div>
            </div>

            <!-- Plano -->
            <div class="col-md-8 plano d-flex justify-content-center mt-3">
                <div id="plano_tarima">
                    <img src="./assets/Logo-Letras-PNG-420x187.png" alt="Logo" id="logo_main" class="mt-4 img-fluid">
                </div>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" aria-hidden="true" aria-labelledby="staticBackdropLabel" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
        <div class="modal-header">
            <h1 class="modal-title fs-5" id="staticBackdropLabel">Tolerancias</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <div class="container">
                <form>
                    <div id="modal_form" class="col select-bar d-flex flex-column justify-content-center">

                    </div>
                </form>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            <button id="btn_sig_modal" type="button" class="btn btn-primary" data-bs-target="#staticBackdrop2" data-bs-toggle="modal">Siguiente</button>
        </div>
        </div>
    </div>
    </div>
    
    <div class="modal fade" id="staticBackdrop2" data-bs-backdrop="static" data-bs-keyboard="false" aria-hidden="true" aria-labelledby="staticBackdropLabel2" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
        <div class="modal-header">
            <h1 class="modal-title fs-5" id="staticBackdropLabel2">Servicios</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <div class="container">
                <form>
                    <div id="modal_serv" class="col select-bar d-flex flex-column justify-content-center">
                        
                    </div>
                </form>
            </div>
        </div>
        <div class="modal-footer">
            <button id="btn_ant_modal" class="btn btn-secondary" data-bs-target="#staticBackdrop" data-bs-toggle="modal">Regresar</button>
            <button id="btn_agregar" type="button" class="btn btn-primary">Agregar</button>
        </div>
        </div>
    </div>
    </div>



    <!-- FOOTER -->
    <footer id="site_footer">
        
    </footer>
    
<script src="./js/nav.js"></script>
<script src="./js/configurador_form.js" type="module"></script>
<script src="./js/configurador.js" type="module"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>
</html>
