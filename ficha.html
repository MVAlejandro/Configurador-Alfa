<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurador - Pallets Alfa</title>
    <link rel="stylesheet" href="./css/ficha.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="icon" href="./assets/Logo-Color-PNG-500x400-1.png">
    </head>
<body>

    <!-- BARRA DE RELLENO SUPERIOR -->
    <div id="top_bar">
        <br>
    </div>

    <!-- BARRA DE NAVEGACION PRINCIPAL -->
    <header id="site_header">
        
    </header>
    
    <!-- BARRA DE NAVEGACION SECUNDARIO -->
    <div id="btn_bar">
        <nav id="nav_secundario" class="navbar w-100">
            <div class="col-auto">
                <button id="btn_regresar" class="btn btn-outline-success ms-5" type="button">Regresar</button>
            </div> 
            <div class="col text-center">
                <h2>Información de tarima</h2>
            </div>
        </nav>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main id="main" class="container">
        <div class="row d-flex">

            <!-- Propiedades -->
            <div class="col-sm-4 d-flex flex-column justify-content-center">
                <h2 class="mt-5 mb-3">Propiedades</h2>
                <div id="propiedades">
                    <!-- Card Capacidad de carga -->
                    <div id="capacidad_carga" class="card mb-5">
                        <div class="card-body">
                            <h5 class="card-title">Capacidad de carga</h5>
                            <p class="card-text">
                                <table class="table table-borderless">
                                    <tbody>
                                        <tr>
                                            <td>Estática:</td>
                                            <td id="capacidad_estatica"></td>
                                        </tr>
                                        <tr>
                                            <td>Dinámica:</td>
                                            <td id="capacidad_dinamica"></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </p>
                        </div>
                    </div>
                    <!-- Card Descripción -->
                    <div id="descripcion" class="card mb-5">
                    <div class="card-body">
                        <h5 class="card-title">Descripción</h5>
                        <p class="card-text">
                            <ul id="lista_resumen">
                                
                            </ul>
                        </p>
                    </div>
                    </div>
                </div>
            </div>

            <!-- Modelo -->
            <div class="col-sm-8 d-flex flex-column justify-content-between position-relative">
                <!-- Card Precio -->
                <div class="cap card mt-5 me-5 align-self-end">
                    <div class="card-body">
                        <h5 class="card-title">Valoración: <span id="costo_final"></span></h5> 
                    </div>
                </div>
                <!-- Imagen Modelo -->
                <div id="modelo" class="flex-grow-1 d-flex justify-content-center align-items-center">
                    <img src="./assets/Logo-Color-PNG-500x400-2.png" alt="Logo" height="230px" id="logo_main" class="mt-4">
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer id="site_footer">
        
    </footer>
    
<script src="./js/nav.js"></script>
<script src="./js/ficha.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>
</html>
